name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pytest onnxruntime

      - name: Syntax gate (AST) — every python file must parse
        run: |
          python -c "
          from pathlib import Path
          import ast, sys
          roots = [Path('app'), Path('scripts'), Path('tests')]
          files = [f for r in roots for f in r.rglob('*.py')] + [Path('pixelmorph.py')]
          bad = []
          for f in files:
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  bad.append(f'{f}: {e}')
          if bad:
              [print(b) for b in bad]
              sys.exit(1)
          print(f'{len(files)} files parsed OK')
          "

      - name: Tests
        run: python -m pytest tests/ -q

      - name: e2e self-test (expect SKIP without models)
        run: python scripts/e2e_selftest.py

      - name: Secret scan
        run: python scripts/secret_scan.py
